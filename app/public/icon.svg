<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4f3c"/>
      <stop offset="60%" stop-color="#1a6b52"/>
      <stop offset="100%" stop-color="#2d8f6f"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96d"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c96d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8c96d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Decorative pattern circles -->
  <circle cx="100" cy="100" r="180" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="32"/>
  <circle cx="440" cy="440" r="120" fill="none" stroke="rgba(232,201,109,0.06)" stroke-width="24"/>

  <!-- Glow behind moon -->
  <circle cx="256" cy="240" r="170" fill="url(#glow)"/>

  <!-- Crescent moon (subtraction technique) -->
  <g>
    <circle cx="256" cy="240" r="120" fill="url(#moon)"/>
    <circle cx="296" cy="220" r="105" fill="url(#bg)"/>
  </g>

  <!-- Small star -->
  <g fill="url(#moon)">
    <path d="M 360 140 L 368 156 L 386 158 L 372 170 L 376 188 L 360 178 L 344 188 L 348 170 L 334 158 L 352 156 Z"/>
  </g>

  <!-- "Amalan" text -->
  <text x="256" y="430" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="2">Amalan</text>
</svg>
